<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #faf7f4;
    --navy: #1a2b3c;
    --navy-d: #111c28;
    --orange: #f47421;
    --orange-d: #d45f0f;
    --muted: #5a6a7a;
    --border: #e8e3dd;
    --ff-disp: 'Fraunces', Georgia, serif;
    --ff-body: 'Instrument Sans', system-ui, sans-serif;
  }

  html, body {
    min-height: 100vh;
    background: var(--cream);
    color: var(--navy);
    font-family: var(--ff-body);
    font-size: 16px;
    line-height: 1.6;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1.25rem 4rem;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 2.5rem;
  }

  .logo-img {
    height: 36px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem 2rem;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 2px 16px rgba(26,43,60,0.07);
  }

  .eyebrow {
    font-family: var(--ff-body);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--ff-disp);
    font-size: clamp(1.6rem, 5vw, 2rem);
    font-weight: 900;
    line-height: 1.2;
    color: var(--navy);
    margin-bottom: 0.75rem;
  }

  h2 {
    font-family: var(--ff-disp);
    font-size: clamp(1.25rem, 4vw, 1.5rem);
    font-weight: 700;
    line-height: 1.3;
    color: var(--navy);
    margin-bottom: 0.6rem;
  }

  .sub {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 1.5rem;
  }

  .disclaimer {

// ── State ────────────────────────────────────────────────────────────────────
let testerId = localStorage.getItem('bento_beta_tester_id');

function getDayNumber() {
  const now = new Date();

}

function progressBar(day) {
  const pct = Math.min(((day - 1) / TOTAL_DAYS) * 100, 100);
  return `<div class="progress-bar-wrap"><div class="progress-label">Day ${day} of ${TOTAL_DAYS}</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
}

function renderSignup() {
  document.getElementById('app').innerHTML = `
    ${logo()}
    <div class="card">
      <div class="eyebrow">Bento Beta — Aug 26 to Sep 8</div>
      <h1>Welcome to the beta.</h1>

      <p style="font-size:0.8rem;color:var(--muted);margin-top:1rem;text-align:center">Already signed up on another device? Enter the same name and email — we'll pick up where you left off.</p>
    </div>`;

  document.getElementById('signup-btn').addEventListener('click', handleSignup);
  document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') handleSignup(); });
}

async function handleSignup() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const err = document.getElementById('err');
  const btn = document.getElementById('signup-btn');

  if (!name || !email) { err.textContent = 'Please enter your name and email.'; err.style.display = 'block'; return; }
  if (!email.includes('@')) { err.textContent = 'Please enter a valid email.'; err.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Saving…';

  // Check if tester already exists by email
  let { data, error } = await db.from('beta_testers')
    .select('id, name')
    .eq('email', email)
    .maybeSingle();

  if (error) { err.textContent = 'Something went wrong. Please try again.'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Let\'s go →'; return; }

  // New tester — insert
  if (!data) {
    const res = await db.from('beta_testers')
      .insert({ name, email })
      .select('id, name')
      .single();
    if (res.error) { err.textContent = 'Something went wrong. Please try again.'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Let\'s go →'; return; }
    data = res.data;
  }

  localStorage.setItem('bento_beta_tester_id', data.id);

function renderQuestion(day) {
  const q = QUESTIONS[day - 1];
  selectedOption = null;
  starRating = 0;

  let inner = '';

  if (q.type === 'task_long') {
    if (q.intro) inner += `<p style="color:var(--muted);font-size:0.95rem;margin-bottom:1.25rem;line-height:1.6">${q.intro}</p>`;
    if (q.disclaimer) inner += DISCLAIMER;
    inner += `<ul class="steps-list">${q.steps.map((s, i) => `<li><div class="step-num">${i + 1}</div><span>${s}</span></li>`).join('')}</ul>`;
    inner += `<p style="font-weight:600;margin-bottom:0.75rem;font-size:0.95rem">${q.question}</p>`;
    inner += `<div class="options-list">${q.options.map((o, i) => `<button class="option" data-i="${i}"><div class="dot"></div>${o}</button>`).join('')}</div>`;
    inner += `<p style="font-weight:600;margin:1.25rem 0 0.5rem;font-size:0.95rem">${q.followup}</p>`;
    inner += `<textarea id="answer" placeholder="${q.placeholder || 'Share your thoughts'}"></textarea>`;
  } else if (q.type === 'task') {
    if (q.disclaimer) inner += DISCLAIMER;
    inner += `<ul class="steps-list">${q.steps.map((s, i) => `<li><div class="step-num">${i + 1}</div><span>${s}</span></li>`).join('')}</ul>`;
    inner += `<p style="font-weight:600;margin-bottom:0.75rem;font-size:0.95rem">${q.question}</p>`;
    inner += `<div class="options-list">${q.options.map((o, i) => `<button class="option" data-i="${i}"><div class="dot"></div>${o}</button>`).join('')}</div>`;
  } else if (q.type === 'multiple_choice') {
    if (q.disclaimer) inner += DISCLAIMER;
    inner += `<div class="options-list">${q.options.map((o, i) => `<button class="option" data-i="${i}"><div class="dot"></div>${o}</button>`).join('')}</div>`;
  } else if (q.type === 'long_answer') {
    if (q.disclaimer) inner += DISCLAIMER;
    inner += `<textarea id="answer" placeholder="${q.placeholder || 'Share your thoughts'}"></textarea>`;
  } else if (q.type === 'dual_long_answer') {
    if (q.disclaimer) inner += DISCLAIMER;
    inner += `<label for="answer-pos" style="margin-top:0.25rem">What's been working well</label>`;
    inner += `<textarea id="answer-pos" placeholder="${q.placeholder_positive || 'Share what you liked'}"></textarea>`;
    inner += `<label for="answer-con">What's been frustrating or confusing</label>`;
    inner += `<textarea id="answer-con" placeholder="${q.placeholder_constructive || 'Share what didn\'t work'}"></textarea>`;
  } else if (q.type === 'rating_text') {
    if (q.sub) inner += `<p class="sub" style="margin-bottom:1rem">${q.sub}</p>`;
    if (q.disclaimer) inner += DISCLAIMER;
    inner += `<div class="stars">${[1,2,3,4,5].map(n => `<button class="star" data-n="${n}" aria-label="${n} star">★</button>`).join('')}</div>`;
    inner += `<textarea id="answer" placeholder="Tell us more" style="margin-top:0.5rem"></textarea>`;
  }

  inner += `<div id="err" class="error-msg" style="display:none"></div>`;
  inner += `<button class="btn" id="submit-btn">Submit →</button>`;

  document.getElementById('app').innerHTML = `
    ${logo()}
    ${progressBar(day)}
    <div class="card">
      <div class="eyebrow">${q.eyebrow}</div>
      <h2>${q.title || q.question}</h2>
      ${q.title && q.question !== q.title && q.type !== 'task_long' ? `<p style="font-size:1rem;color:var(--navy);margin-bottom:1rem;font-weight:500">${q.question}</p>` : ''}
      ${inner}
    </div>`;

  // Option click handlers
  document.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedOption = btn.dataset.i;
    });
  });

  // Star handlers
  document.querySelectorAll('.star').forEach(btn => {
    btn.addEventListener('click', () => {
      starRating = parseInt(btn.dataset.n);
      document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < starRating));
    });
    btn.addEventListener('mouseenter', () => {
      const n = parseInt(btn.dataset.n);
      document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < n));
    });
    btn.addEventListener('mouseleave', () => {
      document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < starRating));
    });
  });

  document.getElementById('submit-btn').addEventListener('click', () => handleSubmit(day, q));
}

async function handleSubmit(day, q) {
  const err = document.getElementById('err');
  const btn = document.getElementById('submit-btn');
  let answer = '';

  if (q.type === 'task_long') {
    if (selectedOption === null) { err.textContent = 'Please select an option.'; err.style.display = 'block'; return; }
    const text = (document.getElementById('answer')?.value || '').trim();
    if (!text) { err.textContent = 'Please add a written response too.'; err.style.display = 'block'; return; }
    answer = `Setup: ${q.options[selectedOption]} | Onboarding feedback: ${text}`;
  } else if (q.type === 'multiple_choice' || q.type === 'task') {
    if (selectedOption === null) { err.textContent = 'Please select an option.'; err.style.display = 'block'; return; }
    answer = q.options[selectedOption];
  } else if (q.type === 'long_answer') {
    answer = (document.getElementById('answer')?.value || '').trim();
    if (!answer) { err.textContent = 'Please write something before submitting.'; err.style.display = 'block'; return; }
  } else if (q.type === 'dual_long_answer') {
    const pos = (document.getElementById('answer-pos')?.value || '').trim();
    const con = (document.getElementById('answer-con')?.value || '').trim();
    if (!pos && !con) { err.textContent = 'Please fill in at least one field.'; err.style.display = 'block'; return; }
    answer = `Positive: ${pos || '(none)'} | Constructive: ${con || '(none)'}`;
  } else if (q.type === 'rating_text') {
    const text = (document.getElementById('answer')?.value || '').trim();
    if (!starRating) { err.textContent = 'Please select a star rating.'; err.style.display = 'block'; return; }
    if (!text) { err.textContent = 'Please add a written response too.'; err.style.display = 'block'; return; }
    answer = `${starRating}/5: ${text}`;
  }

  btn.disabled = true; btn.textContent = 'Saving…';

  const { error } = await db.from('beta_responses').insert({ tester_id: testerId, day_number: day, answer });

  if (error) {
    if (error.code === '23505') { renderAlreadyAnswered(day); return; }
    err.textContent = 'Something went wrong. Please try again.'; err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Submit →';
    return;
  }

  renderThankYou(day);
}

function renderThankYou(day) {
  document.getElementById('app').innerHTML = `
    ${logo()}
    ${progressBar(day)}
    <div class="card" style="text-align:center">
      <span class="thank-you-icon">🙏</span>
      <h2>Thank you for your response!</h2>
      <p class="sub">${day < TOTAL_DAYS ? `Come back tomorrow for Day ${day + 1}.` : 'That was the last one. You\'re done — thank you for everything.'}</p>
      ${day < TOTAL_DAYS ? '<p class="comeback">See you tomorrow.</p>' : ''}
    </div>`;

  confetti({ particleCount: 120, spread: 80, origin: { y: 0.55 }, colors: ['#f47421', '#1a2b3c', '#fff'] });
  setTimeout(() => confetti({ particleCount: 60, spread: 100, origin: { y: 0.4 }, colors: ['#f47421', '#fef3e8', '#1a2b3c'] }), 400);
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  const app = document.getElementById('app');

  if (!testerId) { renderSignup(); return; }

  const day = getDayNumber();

  if (day < 1) { renderNotStarted(); return; }
  if (day > TOTAL_DAYS) { renderEnded(); return; }

  // Check if already answered today
  const { data } = await db.from('beta_responses')
    .select('id')
    .eq('tester_id', testerId)
    .eq('day_number', day)
    .maybeSingle();

  if (data) { renderAlreadyAnswered(day); return; }

  renderQuestion(day);
}

init();
</script>
</body>
