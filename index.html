    <!-- Structured data: MobileApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "operatingSystem": "iOS, Android",
      "offers": {
        "@type": "Offer",
        "price": "0",

        "@type": "EducationalAudience",
        "educationalRole": "student"
      }
    }
    </script>
