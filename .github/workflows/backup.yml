# Weekly database backup.
#
# Supabase's free tier takes no automated backups. When the database went
# unhealthy the entire production dataset existed in exactly one place, and that
# place was the thing that had broken. This makes a second copy every week until
# the project moves to Pro, which does back up on its own.
#
# It exports through PostgREST with the service role rather than pg_dump,
# because that needs only the keys the project already has in GitHub secrets and
# no direct Postgres connection string. Schema lives in supabase/migrations, so
# migrations plus these JSON files is a complete restore.
#
# menu_cache is deliberately excluded. It is regenerable scraped HTML and was
# the thing that filled the disk in the first place.
#
# ENCRYPTED, and that is not optional. THIS REPOSITORY IS PUBLIC, and GitHub
# Actions artifacts on a public repository can be downloaded by anyone who can
# read the repo, which is everyone. An unencrypted export here would publish
# every student's email, dietary restrictions (kosher and halal included), meal
# history and feedback to the open internet. The export is symmetrically
# encrypted with AES-256 before it is ever uploaded, so the artifact being
# public is harmless.
#
# Runs every 6 hours rather than weekly. Actions minutes are free on public
# repositories and a full export is under a megabyte, so frequency costs
# nothing. This matters more now that the research study will hold data that
# cannot be regenerated.
#
# Requires three repository secrets:
#   VITE_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   BACKUP_PASSPHRASE          <- new. Store it somewhere OTHER than this repo.
#
# openssl rather than gpg, deliberately: openssl ships with macOS, so a restore
# needs nothing installed at the moment you need it most. Verified end to end.
#
# To restore:
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#     -pass pass:'<BACKUP_PASSPHRASE>' -in backup.tar.gz.enc | tar xz
# Schema comes from supabase/migrations, so migrations plus these JSON files
# are a complete restore.
name: Weekly backup

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export every table
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, pathlib, datetime

          base = os.environ['SUPABASE_URL'].rstrip('/')
          key  = os.environ['SERVICE_KEY']
          out  = pathlib.Path('backup'); out.mkdir(exist_ok=True)

          tables = ['profiles','dietary_restrictions','nutrition_targets','meal_history',
                    'item_ratings','item_rating_aggregates','streaks','weekly_summaries',
                    'suggestions','suggestion_emphasizes','suggestion_flags',
                    'university_requests','admin_users','pulse_invites','feedback',
                    'push_subscriptions','dining_availability','menu_health_log',
                    'reminder_sends','surveys','survey_responses',
                    # Research study. Absent until the migration lands, and a
                    # 404 is skipped rather than failing the run.
                    'study_participants']

          summary, total, failed = {}, 0, []
          for t in tables:
              rows, offset = [], 0
              while True:
                  req = urllib.request.Request(
                      f'{base}/rest/v1/{t}?select=*&limit=1000&offset={offset}',
                      headers={'apikey': key, 'Authorization': f'Bearer {key}'})
                  try:
                      page = json.loads(urllib.request.urlopen(req, timeout=90).read())
                  except urllib.error.HTTPError as e:
                      # 404 just means the table was never created. Anything else
                      # is a real problem and should fail the run.
                      if e.code != 404:
                          failed.append(f'{t}: HTTP {e.code}')
                      rows = None
                      break
                  rows += page
                  if len(page) < 1000:
                      break
                  offset += 1000
              if rows is None:
                  continue
              (out / f'{t}.json').write_text(json.dumps(rows, indent=1, default=str))
              summary[t] = len(rows)
              total += len(rows)

          (out / 'MANIFEST.json').write_text(json.dumps({
              'taken_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'total_rows': total,
              'tables': summary,
              'note': 'Schema lives in supabase/migrations. menu_cache excluded on purpose.',
          }, indent=2))

          print(f'{total} rows across {len(summary)} tables')
          for t, n in sorted(summary.items()):
              print(f'  {t:<26} {n:>6}')

          if failed:
              raise SystemExit('FAILED: ' + '; '.join(failed))

          # An empty export means something is wrong, and a silent empty backup
          # is worse than no backup because it looks like it worked.
          if total == 0:
              raise SystemExit('FAILED: backup contained zero rows')
          PY

      - name: Encrypt the export
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error title=BACKUP_PASSPHRASE is not set::Refusing to upload an unencrypted export from a PUBLIC repository. Add the secret first."
            exit 1
          fi

          tar czf backup.tar.gz backup/
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:BACKUP_PASSPHRASE \
            -in backup.tar.gz -out backup.tar.gz.enc

          # Leave nothing in plaintext for the upload step to find.
          rm -rf backup backup.tar.gz

          # Prove the ciphertext is actually opaque before publishing it to a
          # public artifact. A silent encryption failure here would expose every
          # student record, so this fails the run rather than trusting openssl.
          if grep -qa '"email"' backup.tar.gz.enc; then
            echo "::error title=Encryption failed::Plaintext found in the output. Not uploading."
            rm -f backup.tar.gz.enc
            exit 1
          fi
          ls -lh backup.tar.gz.enc

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bento-backup-${{ github.run_id }}
          path: backup.tar.gz.enc
          retention-days: 35
