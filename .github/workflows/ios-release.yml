name: iOS release

# A tag like v1.1.0 builds the app, signs it and uploads it to TestFlight.
# Nothing here needs a laptop. Signing is cloud-managed: Xcode asks Apple for
# the certificate and profile using the App Store Connect API key, so no
# certificate or profile is stored anywhere in or beside this repo.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the full .p8 text), APPLE_TEAM_ID
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (same two as ci.yml)
#
# Runs on tags only. Fork pull requests never receive these secrets.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # A manual run builds whatever main is at and uploads it as the version in
  # package.json. Use it to retry a failed release without moving the tag.
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the release is what it claims to be
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" = "tag" ]; then
            # npm version creates matching tags, so a mismatch means a hand-made
            # or mistyped tag. Better to stop than to ship a wrong version.
            [ "${REF_NAME#v}" = "$PKG" ] || { echo "tag $REF_NAME does not match package.json $PKG"; exit 1; }
            # Unfinished branches must not reach TestFlight.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$REF_NAME is not on main"; exit 1; }
          else
            [ "$REF_NAME" = "main" ] || { echo "manual runs are for main only"; exit 1; }
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build web bundle and sync into the native project
        run: |
          # These are baked into the bundle at build time. A missing secret does
          # not fail the build, it ships an app that stops at launch with
          # "Missing VITE_SUPABASE_URL" (build 8.1, found 6 Oct 2026). So check
          # here and stop before a build number is spent. Only whether each is
          # set is tested. The values are never printed.
          [ -n "$VITE_SUPABASE_URL" ] || { echo "::error::repo secret VITE_SUPABASE_URL is empty or missing"; exit 1; }
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || { echo "::error::repo secret VITE_SUPABASE_ANON_KEY is empty or missing"; exit 1; }
          npm run ios:sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Select the newest stable Xcode
        run: |
          # Apple only accepts builds from a recent Xcode, and the runner image
          # carries several. Take the highest non-beta one and refuse anything
          # below 26, which is the floor in IOS_SPEC.md.
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc|preview' | sort -V | tail -1)
          [ -n "$XC" ] || { echo "no stable Xcode on this runner"; ls /Applications; exit 1; }
          sudo xcode-select -s "$XC"
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          [ "$MAJOR" -ge 26 ] || { echo "Xcode $MAJOR is below 26"; exit 1; }
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Write App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          KEY="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          # Fail on a malformed secret now, with a clear message, not as an
          # opaque auth error from Apple ten minutes into the build.
          head -1 "$KEY" | grep -q '^-----BEGIN PRIVATE KEY-----$' || { echo "ASC_KEY_P8 must be the full .p8 text, starting with the BEGIN PRIVATE KEY line"; exit 1; }
          openssl pkey -in "$KEY" -noout || { echo "ASC_KEY_P8 is not a readable private key"; exit 1; }

      - name: Set the team on the App target
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Passing DEVELOPMENT_TEAM on the xcodebuild command line applies it
          # to every target, including Capacitor's Swift packages, and that is a
          # known cause of "requires a development team" errors on package
          # targets. Writing it into the App target's own settings scopes it
          # correctly. The id stays out of the repository because it is only
          # ever written here, in the runner's throwaway checkout.
          [ -n "$APPLE_TEAM_ID" ] || { echo "APPLE_TEAM_ID is empty"; exit 1; }
          PBX=ios/App/App.xcodeproj/project.pbxproj
          BEFORE=$(grep -c 'CODE_SIGN_STYLE = Automatic;' "$PBX")
          [ "$BEFORE" -eq 2 ] || { echo "expected 2 App target configs, found $BEFORE"; exit 1; }
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/" "$PBX"
          [ "$(grep -c "DEVELOPMENT_TEAM = $APPLE_TEAM_ID;" "$PBX")" -eq 2 ]

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Signed with a development profile, which needs at least one device
          # registered in the developer account. Registered 6 Oct 2026.
          #
          # This was archived unsigned for a while, because the team had no
          # device and Apple would not create a development profile ("Your team
          # has no devices from which to generate a provisioning profile").
          # Unsigned worked for a plain app but cannot carry the push
          # notification and Sign in with Apple entitlements: both are
          # restricted, so they only exist in a build signed against a profile.
          # An unsigned archive silently loses them and the app then cannot
          # register for push. Export re-signs this archive for distribution.
          #
          # The version was checked against the tag above. CFBundleVersion must
          # rise on every upload, so it comes from CI and never from a file.
          # It is run_number.run_attempt, for example 14.2. A re-run keeps the
          # run number and bumps the attempt, so a retry after a successful
          # upload is a new build number, not a duplicate Apple rejects. Apple
          # compares dotted build numbers part by part, so 14.2 follows 14.1
          # and 15.1 follows both.
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Bento.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}.${{ github.run_attempt }}"

      - name: Check the archive carries its entitlements
        run: |
          # Fail here, with a clear message, instead of shipping a build that
          # cannot receive push or offer Sign in with Apple.
          APP=$(ls -d "$RUNNER_TEMP"/Bento.xcarchive/Products/Applications/*.app)
          codesign -d --entitlements :- "$APP" 2>/dev/null > "$RUNNER_TEMP/ents.plist"
          for key in aps-environment com.apple.developer.applesignin; do
            grep -q "<key>$key</key>" "$RUNNER_TEMP/ents.plist" || { echo "::error::archive is missing the $key entitlement"; exit 1; }
          done
          echo "entitlements present: aps-environment, applesignin"

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Bento.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Wait for Apple to process the build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          # The export step reports "Upload succeeded" once Apple has received
          # the file. Apple then validates it, and that can fail minutes later
          # with no email: runs 4 and 5 both went green and both builds were
          # rejected for a taken bundle name. So ask Apple for the verdict and
          # fail this run if the build was rejected.
          # A virtual environment, because the runner's Homebrew Python refuses
          # system-wide installs ("externally-managed-environment").
          python3 -m venv "$RUNNER_TEMP/jwtenv"
          "$RUNNER_TEMP/jwtenv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/jwtenv/bin/python" - <<'PY'
          import os, json, time, urllib.request, urllib.error, jwt

          def token():
              now = int(time.time())
              return jwt.encode(
                  {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 1000, "aud": "appstoreconnect-v1"},
                  os.environ["ASC_KEY_P8"], algorithm="ES256",
                  headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})

          def get(path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path,
                                           headers={"Authorization": "Bearer " + token()})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          app = get("/v1/apps?filter[bundleId]=com.bentodining.app")["data"][0]["id"]
          want = os.environ["BUILD_NUMBER"]
          deadline = time.time() + 30 * 60
          last = None
          while time.time() < deadline:
              ups = get("/v1/apps/%s/buildUploads?limit=20" % app)["data"]
              mine = [u["attributes"] for u in ups if u["attributes"]["cfBundleVersion"] == want]
              if mine:
                  st = mine[0]["state"]
                  if st["state"] != last:
                      print("upload %s state: %s" % (want, st["state"])); last = st["state"]
                  if st["errors"]:
                      for e in st["errors"]: print("::error::Apple rejected the build: %s %s" % (e.get("code"), e.get("description")))
                      raise SystemExit(1)
                  builds = get("/v1/builds?filter[app]=%s&filter[version]=%s&limit=1" % (app, want))["data"]
                  if builds:
                      ps = builds[0]["attributes"]["processingState"]
                      print("build processing state:", ps)
                      if ps == "VALID": raise SystemExit(0)
                      if ps in ("INVALID", "FAILED"): raise SystemExit("Apple marked the build " + ps)
              time.sleep(30)
          print("::warning::Apple was still processing build %s after 30 minutes. Check TestFlight." % want)
          PY

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
