name: iOS release

# A tag like v1.1.0 builds the app, signs it and uploads it to TestFlight.
# Nothing here needs a laptop. Signing is cloud-managed: Xcode asks Apple for
# the certificate and profile using the App Store Connect API key, so no
# certificate or profile is stored anywhere in or beside this repo.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the full .p8 text), APPLE_TEAM_ID
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (same two as ci.yml)
#
# Runs on tags only. Fork pull requests never receive these secrets.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # A manual run builds whatever main is at and uploads it as the version in
  # package.json. Use it to retry a failed release without moving the tag.
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the release is what it claims to be
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" = "tag" ]; then
            # npm version creates matching tags, so a mismatch means a hand-made
            # or mistyped tag. Better to stop than to ship a wrong version.
            [ "${REF_NAME#v}" = "$PKG" ] || { echo "tag $REF_NAME does not match package.json $PKG"; exit 1; }
            # Unfinished branches must not reach TestFlight.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$REF_NAME is not on main"; exit 1; }
          else
            [ "$REF_NAME" = "main" ] || { echo "manual runs are for main only"; exit 1; }
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Meal planner tests
        run: npm run test:meals

      - name: Build web bundle and sync into the native project
        run: npm run ios:sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Select the newest stable Xcode
        run: |
          # Apple only accepts builds from a recent Xcode, and the runner image
          # carries several. Take the highest non-beta one and refuse anything
          # below 26, which is the floor in IOS_SPEC.md.
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc|preview' | sort -V | tail -1)
          [ -n "$XC" ] || { echo "no stable Xcode on this runner"; ls /Applications; exit 1; }
          sudo xcode-select -s "$XC"
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          [ "$MAJOR" -ge 26 ] || { echo "Xcode $MAJOR is below 26"; exit 1; }
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Write App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          KEY="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          # Fail on a malformed secret now, with a clear message, not as an
          # opaque auth error from Apple ten minutes into the build.
          head -1 "$KEY" | grep -q '^-----BEGIN PRIVATE KEY-----$' || { echo "ASC_KEY_P8 must be the full .p8 text, starting with the BEGIN PRIVATE KEY line"; exit 1; }
          openssl pkey -in "$KEY" -noout || { echo "ASC_KEY_P8 is not a readable private key"; exit 1; }

      - name: Set the team on the App target
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Passing DEVELOPMENT_TEAM on the xcodebuild command line applies it
          # to every target, including Capacitor's Swift packages, and that is a
          # known cause of "requires a development team" errors on package
          # targets. Writing it into the App target's own settings scopes it
          # correctly. The id stays out of the repository because it is only
          # ever written here, in the runner's throwaway checkout.
          [ -n "$APPLE_TEAM_ID" ] || { echo "APPLE_TEAM_ID is empty"; exit 1; }
          PBX=ios/App/App.xcodeproj/project.pbxproj
          BEFORE=$(grep -c 'CODE_SIGN_STYLE = Automatic;' "$PBX")
          [ "$BEFORE" -eq 2 ] || { echo "expected 2 App target configs, found $BEFORE"; exit 1; }
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/" "$PBX"
          [ "$(grep -c "DEVELOPMENT_TEAM = $APPLE_TEAM_ID;" "$PBX")" -eq 2 ]

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # The version was checked against the tag above. CFBundleVersion must
          # rise on every upload, so it comes from CI and never from a file.
          # It is run_number.run_attempt, for example 14.2. A re-run keeps the
          # run number and bumps the attempt, so a retry after a successful
          # upload is a new build number, not a duplicate Apple rejects. Apple
          # compares dotted build numbers part by part, so 14.2 follows 14.1
          # and 15.1 follows both.
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Bento.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}.${{ github.run_attempt }}"

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Bento.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
