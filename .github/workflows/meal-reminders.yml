# Meal reminders.
#
# Vercel's Hobby plan runs a cron at most once per day, and Bento needs two
# sends. The lunch run stays on Vercel's own scheduler (vercel.json); this
# workflow drives the dinner run by calling the same endpoint with ?meal=dinner.
#
# The canonical host is used directly. The apex domain 308s to www, and curl
# strips the Authorization header when a redirect changes host, so going via
# the apex would silently arrive unauthenticated.
#
# GitHub's scheduler fires in UTC and has no daylight-saving awareness. It does
# NOT pick whichever of the two entries below matches the current offset: it runs
# BOTH, every day. That sent the dinner reminder twice a day, an hour apart, all
# year. The original note here claimed the notification `tag` would hide that,
# which was wrong. A tag replaces a notification still sitting in the tray, so an
# alert an hour later arrives as a brand new one.
#
# Two things keep it to one send now. The guard below lets a run send only inside
# a window of Eastern hours, so the time is right in both EDT and EST. And the
# endpoint itself claims the meal-day in `reminder_sends` before sending, so a
# second run in the same window, or a hand-replayed one, cannot produce a second
# notification. That claim is what makes several attempts per window safe, so
# migrations 029 and 040 must be applied: without them the claim fails and the
# endpoint sends unguarded.
name: Meal reminders

on:
  schedule:
    # Dinner: tried four times across 16:00 to 17:59 Eastern.
    - cron: '45 20 * * *'   # 16:45 EDT, 15:45 EST
    - cron: '15 21 * * *'   # 17:15 EDT, 16:15 EST
    - cron: '45 21 * * *'   # 17:45 EDT, 16:45 EST
    - cron: '15 22 * * *'   # 18:15 EDT, 17:15 EST
    # Evening streak nudge: tried four times across 19:00 to 20:59 Eastern.
    - cron: '30 23 * * *'   # 19:30 EDT, 18:30 EST
    - cron: '0 0 * * *'     # 20:00 EDT, 19:00 EST
    - cron: '30 0 * * *'    # 20:30 EDT, 19:30 EST
    - cron: '0 1 * * *'     # 21:00 EDT, 20:00 EST
  workflow_dispatch:        # lets you fire one by hand to test
    inputs:
      test_user_id:
        description: 'Send one test push to this user id only, and skip the real dinner and streak sends'
        required: false
        default: ''

# A queued run must never overlap one already sending.
concurrency:
  group: meal-reminders
  cancel-in-progress: false

jobs:
  # One test push to one account. Prints what Apple and the browser push service
  # answered, with no tokens in it. Runs only when test_user_id is given.
  test:
    if: github.event_name == 'workflow_dispatch' && inputs.test_user_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Send a test push to one account
        env:
          TEST_USER_ID: ${{ inputs.test_user_id }}
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.bentodining.com/api/send-reminders?meal=lunch&only=${TEST_USER_ID}")
          echo "HTTP $code"
          cat /tmp/out.json
          test "$code" = "200"

  dinner:
    if: github.event_name != 'workflow_dispatch' || inputs.test_user_id == ''
    runs-on: ubuntu-latest
    steps:
      - name: Skip runs outside 16:00 to 17:59 Eastern
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%H)
          echo "Eastern hour is $hour"
          # GitHub's scheduler runs late, by minutes to hours, and drops some
          # runs outright. Between 17 Sep and 8 Oct no run landed in the 16:00
          # hour for days at a time, so a gate on one exact hour sent nothing.
          # Any run inside the window may send. The endpoint claims the meal-day
          # before sending, so a second run in the window is turned away there.
          # A manual dispatch always proceeds.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$hour" != "16" ] && [ "$hour" != "17" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Send dinner reminder
        if: steps.gate.outputs.run == 'yes'
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.bentodining.com/api/send-reminders?meal=dinner")
          echo "HTTP $code"
          cat /tmp/out.json
          # Fail the run on a non-200 so a broken send is visible in Actions
          # rather than silently doing nothing every evening.
          test "$code" = "200"

  streak:
    if: github.event_name != 'workflow_dispatch' || inputs.test_user_id == ''
    runs-on: ubuntu-latest
    steps:
      - name: Skip runs outside 19:00 to 20:59 Eastern
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%H)
          echo "Eastern hour is $hour"
          # Same reasoning as dinner: any run from 19:00 to 20:59 Eastern may send,
          # and the endpoint's claim keeps it to one. A manual dispatch runs it
          # regardless, so it can be tested.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$hour" != "19" ] && [ "$hour" != "20" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Send streak nudge
        if: steps.gate.outputs.run == 'yes'
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.bentodining.com/api/send-reminders?meal=streak")
          echo "HTTP $code"
          cat /tmp/out.json
          [ "$code" = "200" ]
